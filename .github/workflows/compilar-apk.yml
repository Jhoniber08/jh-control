name: Compilar APK de JH Control

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar MAUI para Android
        run: dotnet workload install maui-android

      - name: Restaurar paquetes
        run: dotnet restore JHControl/JHControl.csproj

      - name: Instalar dependencias de Android
        run: dotnet build JHControl/JHControl.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Compilar APK
        run: dotnet publish JHControl/JHControl.csproj -f net10.0-android -c Release -o salida -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: JHControl-APK
          path: salida/*-Signed.apk
